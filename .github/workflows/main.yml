name: Build Quizzler EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
            pip install -r requirements.txt
            pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --add-data "images;images" --name Quizzler main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Quizzler-Windows
          path: dist/Quizzler.exe
